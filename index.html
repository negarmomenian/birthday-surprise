<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>All of You✧</title>

    <link rel="stylesheet" href="Css/style.css" />
    <link rel="stylesheet" href="Css/meadow.css" />
    <link rel="stylesheet" href="Css/flowers.css" />
    <link rel="stylesheet" href="Css/panel.css" />
    <link rel="stylesheet" href="Css/particles.css" />
    <link rel="stylesheet" href="Css/leaves.css" />
    <link rel="stylesheet" href="Css/guide.css" />
    <link rel="stylesheet" href="Css/petals.css" />
    <link rel="stylesheet" href="Css/audio.css" />
    <link rel="stylesheet" href="Css/magic.css" />
    <link rel="stylesheet" href="Css/welcome.css" />
    <link rel="stylesheet" href="Css/parallax.css" />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌼</text></svg>"
    />
  </head>

  <body>
    <main id="world">
      <div class="meadow"></div>

      <div class="sky-layer"></div>
      <div class="atmosphere-layer"></div>
      <div class="light-layer"></div>

      <div class="clouds">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
      </div>

      <div class="stars"></div>
      <div class="star-dim"></div>
      <div class="moon"></div>

      <div class="clouds-over">
        <div class="cloud-over cloud-over-1"></div>
        <div class="cloud-over cloud-over-2"></div>
        <div class="cloud-over cloud-over-3"></div>
        <div class="cloud-over cloud-over-4 reverse"></div>
        <div class="cloud-over cloud-over-5 reverse"></div>
      </div>

      <div class="particles" id="particles"></div>
      <div class="leaves" id="leaves"></div>

      <div id="flowers"></div>

      <div id="memory-panel"></div>
    </main>

    <script src="Js/time.js"></script>
    <script src="Js/sky.js"></script>
    <script src="Js/flowers.js"></script>
    <script src="Js/petals.js"></script>
    <script src="Js/memories.js"></script>
    <script src="Js/preload.js"></script>
    <script src="Js/particles.js"></script>
    <script src="Js/leaves.js"></script>
    <script src="Js/hint.js"></script>
    <script src="Js/audio.js"></script>
    <script src="Js/magic.js"></script>
    <script src="Js/welcome.js"></script>
    <script src="Js/parallax.js"></script>
    <script src="Js/main.js"></script>
  </body>
</html>
